# Every parameter the pipeline uses lives here. Changing a value here and
# re-running `make` regenerates every downstream table and figure.

corpus:
  # CMU CALO release of the Enron email corpus (May 7, 2015 version).
  # https://www.cs.cmu.edu/~enron/
  url: https://www.cs.cmu.edu/~enron/enron_mail_20150507.tar.gz
  filename: enron_mail_20150507.tar.gz
  # CMU does not publish a checksum. This SHA-256 was recorded on the first
  # download (2026-09-25); any later download must match it byte for byte.
  sha256: b3da1b3fe0369ec3140bb4fbce94702c33b7da810ec15d718b3fadf5cd748ca7
  bytes: 443254787

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  figures: figures

ingest:
  # Analysis window (inclusive). Messages dated outside it are counted in the
  # funnel and then excluded.
  start: "1998-01-01"
  end: "2002-12-31"

senders:
  internal_domain: enron.com
  # A sender is treated as automated when at least `min_messages` of their
  # messages exist and at least `template_share` of them reduce to the same
  # template once digits and times are masked (e.g. scheduling feeds).
  min_messages: 50
  template_share: 0.5

threads:
  # A message replies to the latest earlier message with the same normalized
  # subject that was sent to its sender within this many days.
  max_reply_days: 14

random_seed: 42

# Every parameter the pipeline uses lives here. Changing a value here and
# re-running `make` regenerates every downstream table and figure.

corpus:
  # CMU CALO release of the Enron email corpus (May 7, 2015 version).
  # https://www.cs.cmu.edu/~enron/
  url: https://www.cs.cmu.edu/~enron/enron_mail_20150507.tar.gz
  filename: enron_mail_20150507.tar.gz
  # CMU does not publish a checksum. This SHA-256 was recorded on the first
  # download (2026-09-25); any later download must match it byte for byte.
  sha256: b3da1b3fe0369ec3140bb4fbce94702c33b7da810ec15d718b3fadf5cd748ca7
  bytes: 443254787

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  figures: figures
  results: results

ingest:
  # Analysis window (inclusive). Messages dated outside it are counted in the
  # funnel and then excluded.
  start: "1998-01-01"
  end: "2002-12-31"

senders:
  internal_domain: enron.com
  # Templates are the first 80 characters of authored text with digits masked;
  # pure forwards (no authored text) are not counted.
  # A sender is an automated feed when they have at least `min_messages`
  # messages with text and at least `feed_share` of them fall into their
  # `top_templates` most common templates. Feeds are excluded entirely.
  min_messages: 50
  top_templates: 3
  feed_share: 0.9
  # A message is routine (e.g. a weekly report blast) when its template repeats
  # at least `routine_repeats` times for the same sender. Routine messages are
  # kept in the communication network but excluded from text analysis.
  routine_repeats: 10

identity:
  # Synthetic addresses created by the CMU export (missing From) and the Lotus
  # Notes gateway. Messages from them are attributed only by their own display
  # name; mail to them is dropped. Addresses shared by several named senders,
  # none covering half their messages, are added automatically.
  placeholder_addresses:
    - no.address@enron.com
    - 40enron@enron.com
  # A first/last name is split by middle initial when two initials each appear
  # on at least this many messages (Mark A Taylor vs Mark E Taylor).
  min_initial_support: 5
  # A message without an initial takes the initial its directory ID or address
  # uses on at least this share of its initialled messages.
  initial_share: 0.6667

threads:
  # A message replies to the latest earlier message with the same normalized
  # subject that was sent to its sender within this many days.
  max_reply_days: 14

formal_rank:
  # Shetty & Adibi (2004) title list for Enron employees, as archived by the
  # Internet Archive on 2013-09-18 (the original ISI page is offline).
  url: http://web.archive.org/web/20130918164648id_/http://www.isi.edu:80/~adibi/Enron/Enron_Employee_Status.xls
  filename: Enron_Employee_Status.xls
  sha256: 5f67ea06209a51a57c5b05608cc9f56c58c97e62892735eed4232313ff54c071
  # Ordinal seniority level for each title in the list (higher = more senior).
  # Rows with no title are excluded.
  levels:
    CEO: 6
    President: 5
    Managing Director: 4
    Vice President: 3
    Director: 2
    Director of Trading: 2
    Manager: 1
    In House Lawyer: 1
    Trader: 0
    Employee: 0
  # Reviewed corrections: spelling errors in the 2004 list mapped to the
  # person key found in the corpus. Every entry was checked against the
  # person's own sent mail. Names not listed and not found stay unmatched
  # (e.g. "Jacob Thomas": the thomas-p mailbox belongs to Paul D. Thomas).
  corrections:
    Micheal Swerzzbin: michael swerzbin
    James Schweiger: james schwieger
    TimothyHeizenrader: timothy heizenrader
    Douglas Gilberth-Smith: douglas gilbert-smith
    Thomos Alonso: thomas alonso
    Cristopher Foster: christopher foster
    John Lloldra: john llodra
    Eric Lynder: eric linder
    Daron Giron: darron giron
    John Giffith: john griffith
    Harpreet Arora: harry arora
    # Homonym: the corpus separates Mark A Taylor and Mark E Taylor. The listed
    # Mark Taylor is the taylor-m custodian, whose sent mail is Mark E Taylor.
    Mark Taylor: mark e taylor

evaluation:
  # Person-level bootstrap resamples for 95% intervals.
  bootstrap_reps: 1000

validation:
  # Messages sampled (fixed seed) to cross-check quote removal against email_reply_parser.
  sample_size: 5000

random_seed: 42

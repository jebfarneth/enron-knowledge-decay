[project]
name = "enron-functional"
version = "0.1.0"
description = "Functional importance in the Enron corpus: dated absences, who covered for whom, and what happened while people were away"
authors = [{ name = "Jeb Farneth" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enron_functional"]

[tool.pytest.ini_options]
testpaths = ["tests"]

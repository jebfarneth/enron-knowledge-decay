[project]
name = "enron-importance"
version = "0.1.0"
description = "Measuring hidden functional importance from workplace email (Enron corpus)"
authors = [{ name = "Jeb Farneth" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "xlrd>=2.0",
    "igraph>=0.11",
    "pymongo>=4.18.2",
]

[dependency-groups]
dev = [
    "email-reply-parser>=0.5",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enron_importance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
